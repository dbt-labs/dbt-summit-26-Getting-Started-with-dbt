version: 2

sources:
  - name: jaffle_shop
    database: raw
    tables:
      - name: customer_web_activity
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: items
      - name: locations
      - name: order_items
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            data_tests:
              - not_null
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - completed
                      - placed
                      - return_pending
                      - returned
                      - shipped
          - name: _etl_loaded_at
            data_tests:
              - not_null
      - name: products
      - name: raw_customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
      - name: raw_items
      - name: raw_orders
        columns:
          - name: customer
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'raw_customers')
                    field: id
          - name: order_total
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
      - name: raw_products
      - name: raw_stores
      - name: raw_supplies
      - name: stores
      - name: supplies
