version: 2

models:
  - name: _stg__jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: _stg__jaflle_shop_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('_stg__jaffle_shop__customers')
                field: customer_id
