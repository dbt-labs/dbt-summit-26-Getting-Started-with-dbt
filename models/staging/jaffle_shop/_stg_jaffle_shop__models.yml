version: 2

models:
  - name: stg_jaffle_shop__customer
    description: >
      Standardized customer records from the Jaffle Shop source. One row per
      customer, with the source identifier renamed for consistent downstream use.
    columns:
      - name: customer_id
        description: Primary key for the customer, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as provided by the source system.
      - name: last_name
        description: Customer's last name as provided by the source system.

  - name: stg_jaffle_shop__orders
    description: >
      Standardized order records from the Jaffle Shop source. One row per order,
      with customer and order identifiers named consistently for downstream joins.
    columns:
      - name: order_id
        description: Primary key for the order, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key identifying the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customer')
                field: customer_id
      - name: order_date
        description: Calendar date on which the order was placed.
      - name: status
        description: Current order lifecycle status reported by the source system.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - placed
                  - return_pending
                  - returned
                  - shipped
      - name: _etl_loaded_at
        description: Timestamp when the source record was loaded by the upstream ETL process.
