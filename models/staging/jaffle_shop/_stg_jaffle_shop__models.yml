version: 2

models:
  - name: stg_jaffle_shop__customer
    description: One row per customer, with source fields renamed for consistent downstream use.
    columns:
      - name: customer_id
        description: Unique customer identifier, renamed from the source `id`; defines the model grain and joins customers to orders.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as recorded in the source system.
      - name: last_name
        description: Customer's last name as recorded in the source system.

  - name: stg_jaffle_shop__orders
    description: One row per order, preserving source order attributes for downstream customer and order analysis.
    columns:
      - name: order_id
        description: Unique order identifier, renamed from the source `id`; defines the model grain.
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: Customer identifier associated with the order; joins to `stg_jaffle_shop__customer.customer_id`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customer')
                field: customer_id
      - name: order_date
        description: Date the order was placed, used to calculate customer ordering history.
        data_tests:
          - not_null
      - name: status
        description: Current order lifecycle status supplied by the source system.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
      - name: _etl_loaded_at
        description: Timestamp when the order record was loaded into the source table, used to assess data recency.
