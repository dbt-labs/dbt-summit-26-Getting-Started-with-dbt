version: 2

models:
  - name: dim_customers
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "number_of_orders >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_order_date <= most_recent_order_date"
          config:
            where: "first_order_date is not null"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customer')
                field: customer_id
      - name: number_of_orders
        data_tests:
          - not_null
