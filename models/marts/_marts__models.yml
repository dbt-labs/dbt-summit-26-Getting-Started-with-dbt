version: 2

models:
  - name: customers
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "number_of_orders >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_order_date <= most_recent_order_date"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: number_of_orders
        data_tests:
          - not_null
