version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: id
      - name: number_of_orders
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
