version: 2

models:
  - name: customers
    description: >
      Customer-level mart for customer and order analysis. One row per customer,
      including customers who have never ordered; those customers have null order
      dates and a `number_of_orders` value of zero.
    columns:
      - name: customer_id
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as provided by the source system.
      - name: last_name
        description: Customer's last name as provided by the source system.
      - name: first_order_date
        description: Earliest order date for the customer; null when the customer has no orders.
      - name: most_recent_order_date
        description: Latest order date for the customer; null when the customer has no orders.
      - name: number_of_orders
        description: Count of orders placed by the customer, defaulted to zero when none exist.
        data_tests:
          - not_null
